<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/AhmedQotb/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ahmed Qotb — Senior Web Developer, Graphic Designer and Motion Graphics Designer." />
    <meta name="theme-color" content="#F4F8FC" />
    <meta property="og:title" content="Ahmed Qotb — Portfolio" />
    <meta property="og:description" content="Web development, graphic design, motion graphics and video editing." />
    <meta property="og:image" content="/AhmedQotb/images/profile/Ahmed.webp" />
    <title>Ahmed Qotb — Creative Technologist</title>
  </head>
  <body>
    <script>
      try {
        const savedTheme = localStorage.getItem('ahmed-qotb-theme');
        const theme = savedTheme === 'dark' || savedTheme === 'light'
          ? savedTheme
          : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#0B1220' : '#F4F8FC';
      } catch (error) {
        console.warn('Unable to initialize the saved theme preference.', error);
        const theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#0B1220' : '#F4F8FC';
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
